<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#020617;font-family:"DejaVu Sans",Arial,sans-serif}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
  <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
</defs>
<rect width="1440" height="900" fill="#020617"/><rect width="1440" height="900" fill="url(#grid)"/>

<text x="40" y="48" fill="#e2e8f0" font-size="28" font-weight="bold">Discord voice control: how it works</text>
<text x="40" y="76" fill="#94a3b8" font-size="16">You talk to your phone. GPT-Live is the ears and voice. A dedicated Hermes profile is the brain. Posts go out as you at once; say "undo" to reverse.</text>

<!-- PC boundary -->
<rect x="360" y="100" width="640" height="760" rx="14" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="9,5"/>
<text x="378" y="126" fill="#fbbf24" font-size="15">Your PC · reachable only on your Tailscale network</text>

<!-- arrows (drawn first) -->
<line x1="150" y1="262" x2="150" y2="372" stroke="#94a3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="162" y="310" fill="#cbd5e1" font-size="14">① you speak</text>
<text x="162" y="330" fill="#cbd5e1" font-size="14">⑥ it speaks</text>

<line x1="262" y1="190" x2="398" y2="190" stroke="#94a3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="268" y="176" fill="#cbd5e1" font-size="14">② words</text>
<text x="268" y="212" fill="#cbd5e1" font-size="14">⑤ answer</text>

<line x1="680" y1="290" x2="680" y2="362" stroke="#94a3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="692" y="332" fill="#cbd5e1" font-size="14">③ ask · answer</text>

<line x1="680" y1="490" x2="680" y2="552" stroke="#94a3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="692" y="526" fill="#cbd5e1" font-size="14">uses its tools</text>

<path d="M962 620 C1020 620 1030 560 1068 540" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="1012" y="650" fill="#cbd5e1" font-size="14">④ reads rooms</text>

<path d="M962 200 C1060 200 1120 250 1180 352" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#r)"/>
<text x="1012" y="168" fill="#fb7185" font-size="14">posts as you, at once</text>
<text x="1012" y="186" fill="#fb7185" font-size="14">"undo" reverses</text>

<path d="M1200 562 C1200 720 1080 790 962 790" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#g)"/>
<text x="1215" y="700" fill="#34d399" font-size="14">your agent sees</text>
<text x="1215" y="718" fill="#34d399" font-size="14">your post</text>
<text x="1215" y="736" fill="#34d399" font-size="14">and replies</text>

<!-- phone -->
<rect x="40" y="120" width="222" height="142" rx="8" fill="#0f172a"/><rect x="40" y="120" width="222" height="142" rx="8" fill="rgba(8,51,68,0.45)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="56" y="152" fill="#e2e8f0" font-size="19" font-weight="bold">Your iPhone</text>
<text x="56" y="178" fill="#94a3b8" font-size="14">web page over Tailscale</text>
<text x="56" y="198" fill="#94a3b8" font-size="14">signs you in automatically</text>
<text x="56" y="218" fill="#94a3b8" font-size="14">mic + speaker</text>
<text x="56" y="238" fill="#94a3b8" font-size="14">tap to start, talk freely</text>

<!-- GPT-Live -->
<rect x="40" y="374" width="222" height="166" rx="8" fill="#0f172a"/><rect x="40" y="374" width="222" height="166" rx="8" fill="rgba(30,41,59,0.6)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="56" y="406" fill="#e2e8f0" font-size="19" font-weight="bold">GPT-Live (OpenAI)</text>
<text x="56" y="432" fill="#94a3b8" font-size="14">your ChatGPT subscription</text>
<text x="56" y="452" fill="#94a3b8" font-size="14">hears you, speaks back</text>
<text x="56" y="472" fill="#94a3b8" font-size="14">does no thinking itself:</text>
<text x="56" y="492" fill="#94a3b8" font-size="14">hands requests to the app</text>
<text x="56" y="516" fill="#94a3b8" font-size="13">"one moment" filler is muted</text>

<!-- app -->
<rect x="400" y="140" width="560" height="148" rx="8" fill="#0f172a"/><rect x="400" y="140" width="560" height="148" rx="8" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1.5"/>
<text x="418" y="172" fill="#e2e8f0" font-size="19" font-weight="bold">Voice app</text>
<text x="418" y="198" fill="#cbd5e1" font-size="15">• passes your words to the brain, one action per sentence</text>
<text x="418" y="220" fill="#cbd5e1" font-size="15">• runs every write itself and remembers how to undo it</text>
<text x="418" y="242" fill="#cbd5e1" font-size="15">• posts with your name + avatar (webhook)</text>
<text x="418" y="264" fill="#cbd5e1" font-size="15">• keeps the call log (what you said, replies, errors)</text>

<!-- hermes profile -->
<rect x="400" y="364" width="560" height="124" rx="8" fill="#0f172a"/><rect x="400" y="364" width="560" height="124" rx="8" fill="rgba(76,29,149,0.45)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="418" y="396" fill="#e2e8f0" font-size="19" font-weight="bold">Hermes profile "discord-voice" (the brain)</text>
<text x="418" y="422" fill="#cbd5e1" font-size="15">• sole job: your Discord. Narrow tools, fast settings</text>
<text x="418" y="444" fill="#cbd5e1" font-size="15">• briefed with its job, speed rules and a map of your server</text>
<text x="418" y="466" fill="#cbd5e1" font-size="15">• short spoken answers; remembers the call ("reply there")</text>

<!-- tools -->
<rect x="400" y="554" width="560" height="148" rx="8" fill="#0f172a"/><rect x="400" y="554" width="560" height="148" rx="8" fill="rgba(76,29,149,0.25)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="418" y="586" fill="#e2e8f0" font-size="19" font-weight="bold">Its Discord tools</text>
<text x="418" y="612" fill="#cbd5e1" font-size="15">read: a room by spoken name, "what's new", pinned messages</text>
<text x="418" y="634" fill="#cbd5e1" font-size="15">write: post, reply, react, pin, thread, rename, new channel</text>
<text x="418" y="660" fill="#fb7185" font-size="15">the app executes the write; "undo" reverses the last one</text>
<text x="418" y="682" fill="#94a3b8" font-size="14">no delete, ban, roles, money, deploys or email</text>

<!-- main agent -->
<rect x="400" y="752" width="560" height="84" rx="8" fill="#0f172a"/><rect x="400" y="752" width="560" height="84" rx="8" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1.5"/>
<text x="418" y="784" fill="#e2e8f0" font-size="19" font-weight="bold">Your main agent (optional)</text>
<text x="418" y="810" fill="#cbd5e1" font-size="15">can treat the webhook posts as you and answer them</text>

<!-- discord -->
<rect x="1060" y="352" width="340" height="210" rx="8" fill="#0f172a"/><rect x="1060" y="352" width="340" height="210" rx="8" fill="rgba(88,101,242,0.25)" stroke="#818cf8" stroke-width="1.5"/>
<text x="1078" y="384" fill="#e2e8f0" font-size="19" font-weight="bold">Discord: your server</text>
<text x="1078" y="412" fill="#cbd5e1" font-size="15">channels, threads, forums</text>
<text x="1078" y="434" fill="#cbd5e1" font-size="15">support, dev threads, forums</text>
<text x="1078" y="456" fill="#cbd5e1" font-size="15">and every room the bot can see</text>
<text x="1078" y="510" fill="#94a3b8" font-size="14">your posts show your name</text>
<text x="1078" y="530" fill="#94a3b8" font-size="14">with a small APP badge</text>

<!-- timings -->
<rect x="40" y="590" width="290" height="246" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="56" y="620" fill="#e2e8f0" font-size="17" font-weight="bold">Two kinds of request</text>
<text x="56" y="648" fill="#22d3ee" font-size="15">Ask: ① → ⑥</text>
<text x="56" y="668" fill="#94a3b8" font-size="14">"what's new in the support forum?"</text>
<text x="56" y="688" fill="#94a3b8" font-size="14">about 4–10 seconds</text>
<text x="56" y="720" fill="#fb7185" font-size="15">Post: said → sent</text>
<text x="56" y="740" fill="#94a3b8" font-size="14">posts as you straight away</text>
<text x="56" y="760" fill="#94a3b8" font-size="14">as you → your agent replies</text>
<text x="56" y="780" fill="#94a3b8" font-size="14">about 3 seconds · "undo" to reverse</text>
<text x="56" y="812" fill="#64748b" font-size="13">DVC_CONFIRM=1: ask before posting</text>
</svg></body></html>
